name: Build Android App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create app project
        run: |
          mkdir -p build-app/www
          cd build-app
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp ../index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "sa.ratl.safwa",
            "appName": "صفوة رتّل",
            "webDir": "www",
            "backgroundColor": "#faf7f1",
            "server": {
              "url": "https://mj-idd.github.io/safwa-ratl/",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: App icon
        run: |
          cd build-app/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp ../../../../../../icon-192.png "$d/ic_launcher.png"
            cp ../../../../../../icon-192.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        run: |
          cd build-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../safwa-ratl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: safwa-ratl-apk
          path: safwa-ratl.apk

      - name: Publish APK to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add safwa-ratl.apk
          git commit -m "Android app build" || exit 0
          git push
